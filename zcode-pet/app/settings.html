<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>zcode-pet 宠物市场</title>
<style>
  :root {
    --bg: #F5F3EF; --card: #FFFFFF; --ink: #2A2118; --sub: #8A7E70;
    --accent: #F59B33; --accent-2: #E8862A; --line: #E8E2D8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font: 13px -apple-system, "PingFang SC", sans-serif; color: var(--ink);
    background: var(--bg); display: flex; flex-direction: column; overflow: hidden;
    -webkit-user-select: none;
  }
  header {
    display: flex; gap: 10px; align-items: center; padding: 12px 14px;
    background: rgba(255,255,255,.75); border-bottom: 1px solid var(--line);
    backdrop-filter: blur(12px); flex: none;
  }
  .logo { font-weight: 700; font-size: 14px; margin-right: 2px; }
  .logo .paw { color: var(--accent); }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 5px 14px; border-radius: 8px; cursor: pointer; color: var(--sub);
    font-weight: 600; transition: all .15s;
  }
  .tab.on { background: var(--ink); color: #fff; }
  .tab:not(.on):hover { background: rgba(0,0,0,.06); color: var(--ink); }
  .search {
    flex: 1; max-width: 260px; margin-left: auto; position: relative;
  }
  .search input {
    width: 100%; padding: 6px 12px 6px 30px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; font: inherit; color: var(--ink); outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .search::before {
    content: "🔍"; position: absolute; left: 8px; top: 50%;
    transform: translateY(-50%); font-size: 11px; opacity: .5;
  }
  .kinds { display: flex; gap: 4px; }
  .kind {
    padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
    color: var(--sub); border: 1px solid transparent;
  }
  .kind.on { color: var(--accent-2); border-color: var(--accent-2); background: rgba(245,155,51,.08); }

  #grid {
    flex: 1; overflow-y: auto; padding: 14px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
    gap: 12px; align-content: start;
  }
  .pet-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 8px 8px; text-align: center; cursor: pointer;
    transition: transform .12s, box-shadow .12s;
  }
  .pet-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(60,35,10,.13); }
  .pet-card.cur { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(245,155,51,.35); }
  .thumb {
    width: 96px; height: 104px; margin: 0 auto 6px;
    background-repeat: no-repeat; background-position: 0 0;
    background-size: 800% var(--rows, 900%);
    image-rendering: -webkit-optimize-contrast;
    filter: drop-shadow(0 2px 4px rgba(50, 30, 10, 0.28));
  }
  @keyframes idlePlay { from { background-position-x: 0; } to { background-position-x: var(--step, -576px); } }
  .nm { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 11px; color: var(--sub); margin-top: 1px; }
  .badge {
    display: inline-block; margin-top: 4px; font-size: 10px; padding: 1px 8px;
    border-radius: 99px; background: rgba(245,155,51,.12); color: var(--accent-2); font-weight: 600;
  }

  #mine { flex: 1; overflow-y: auto; padding: 14px; display: none;
    grid-template-columns: repeat(auto-fill, minmax(108px, 1fr)); gap: 12px; align-content: start; }

  footer {
    flex: none; padding: 8px 14px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--sub); display: flex; justify-content: space-between;
    background: rgba(255,255,255,.7);
  }

  /* 详情浮层 */
  #detail {
    position: fixed; inset: 0; background: rgba(30,22,12,.45); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #detail.show { display: flex; }
  .sheet-card {
    background: #fff; border-radius: 18px; padding: 22px 26px; width: 320px;
    text-align: center; box-shadow: 0 18px 50px rgba(30,20,5,.35);
  }
  .big {
    width: 192px; height: 208px; margin: 4px auto 12px;
    background-repeat: no-repeat; background-position: 0 0;
    background-size: 800% var(--rows, 900%);
    animation: idlePlay 1100ms steps(6) infinite;
    filter: drop-shadow(0 4px 8px rgba(50, 30, 10, 0.30));
  }
  .d-nm { font-size: 17px; font-weight: 700; }
  .d-meta { color: var(--sub); font-size: 12px; margin: 4px 0 2px; }
  .d-desc {
    font-size: 12px; color: var(--ink); opacity: .8; margin: 8px 0 14px;
    max-height: 54px; overflow-y: auto; line-height: 1.5;
  }
  .btns { display: flex; gap: 8px; justify-content: center; }
  button {
    font: 600 13px -apple-system, "PingFang SC", sans-serif; border-radius: 9px;
    padding: 8px 22px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  button.primary { background: linear-gradient(180deg, #FFC775, var(--accent)); border-color: var(--accent-2); color: #4A2B05; }
  button:disabled { opacity: .5; cursor: default; }
  .spinner {
    width: 22px; height: 22px; margin: 60px auto; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; color: var(--sub); margin-top: 80px; grid-column: 1/-1; }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="paw">🐾</span> zcode-pet</div>
  <div class="tabs">
    <div class="tab on" id="tabMarket">市场</div>
    <div class="tab" id="tabMine">我的宠物</div>
  </div>
  <div class="kinds" id="kinds">
    <div class="kind on" data-k="">全部</div>
    <div class="kind" data-k="character">角色</div>
    <div class="kind" data-k="creature">生物</div>
    <div class="kind" data-k="object">物品</div>
  </div>
  <div class="search"><input id="q" placeholder="搜索 petdex（名字 / slug）…" /></div>
</header>

<div id="grid"><div class="spinner"></div></div>
<div id="mine"></div>

<footer>
  <span id="src">数据源：petdex.dev 社区仓库</span>
  <span id="cnt">加载中…</span>
</footer>

<div id="detail">
  <div class="sheet-card">
    <div class="big" id="dThumb"></div>
    <div class="d-nm" id="dName"></div>
    <div class="d-meta" id="dMeta"></div>
    <div class="d-desc" id="dDesc"></div>
    <div class="btns">
      <button id="dCancel">取消</button>
      <button class="primary" id="dAdopt">领养</button>
    </div>
  </div>
</div>

<script>
  // ===== Swift 桥 =====
  // JS -> Swift: webkit.messageHandlers.pet.postMessage({...})
  // Swift -> JS: window.__onHostMsg('{...}')
  function send(msg) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.pet)
      window.webkit.messageHandlers.pet.postMessage(msg);
  }
  window.__onHostMsg = function (s) {
    const m = JSON.parse(s);
    switch (m.type) {
      case "manifest": onManifest(m.json ? JSON.parse(m.json) : null, m.error); break;
      case "installed": onInstalled(m.pets || [], m.current); break;
      case "adopted": onAdopted(m); break;
      case "dressed": onDressed(m); break;
    }
  };

  // ===== 状态 =====
  let pets = [];          // manifest v2 元组数组
  let assetBase = "";
  let fields = [];
  let shown = [];         // 过滤后
  let rendered = 0;       // 已渲染数（分页）
  let kind = "";
  let q = "";
  let installedNames = new Set();
  let currentPet = "builtin";
  let adopting = null;
  const PAGE = 60;

  const $ = id => document.getElementById(id);
  const f = (tuple, name) => tuple[fields.indexOf(name)];

  function onManifest(man, err) {
    const grid = $("grid");
    if (!man || !man.pets) {
      grid.innerHTML = `<div class="empty">⚠︎ ${err || "manifest 拉取失败，请检查网络后重开市场窗口"}</div>`;
      $("cnt").textContent = "";
      return;
    }
    assetBase = man.assetBase || "https://assets.petdex.dev";
    fields = man.fields || ["slug","displayName","kind","submittedBy","spritesheet","petJson","zip","spriteVersionNumber"];
    pets = man.pets;
    applyFilter();
  }

  function applyFilter() {
    const ql = q.trim().toLowerCase();
    shown = pets.filter(t => {
      if (kind && f(t, "kind") !== kind) return false;
      if (!ql) return true;
      return (f(t, "slug") || "").toLowerCase().includes(ql)
          || (f(t, "displayName") || "").toLowerCase().includes(ql);
    });
    rendered = 0;
    $("grid").innerHTML = "";
    $("cnt").textContent = `${shown.length} / ${pets.length} 只`;
    renderMore();
  }

  function renderMore() {
    const grid = $("grid");
    if (rendered >= shown.length) {
      if (shown.length === 0) grid.innerHTML = `<div class="empty">没有匹配的宠物</div>`;
      return;
    }
    const frag = document.createDocumentFragment();
    const end = Math.min(rendered + PAGE, shown.length);
    for (let i = rendered; i < end; i++) frag.appendChild(cardEl(shown[i]));
    grid.appendChild(frag);
    rendered = end;
  }

  function cardEl(t) {
    const slug = f(t, "slug"), nm = f(t, "displayName") || slug;
    const rows = (f(t, "spriteVersionNumber") || 1) >= 2 ? 11 : 9;
    const el = document.createElement("div");
    el.className = "pet-card" + (currentPet === slug ? " cur" : "");
    el.dataset.slug = slug;
    const th = document.createElement("div");
    th.className = "thumb";
    th.style.backgroundImage = `url(${assetBase}/${f(t, "spritesheet")})`;
    th.style.setProperty("--rows", rows * 100 + "%");
    el.appendChild(th);
    const nameEl = document.createElement("div"); nameEl.className = "nm"; nameEl.textContent = nm; el.appendChild(nameEl);
    void 0;
    const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = "by " + (f(t, "submittedBy") || "?"); el.appendChild(meta);
    if (installedNames.has(slug)) {
      const b = document.createElement("div"); b.className = "badge"; b.textContent = "已领养"; el.appendChild(b);
    }
    el.onclick = () => openDetail(t);
    return el;
  }

  function openDetail(t) {
    adopting = {
      slug: f(t, "slug"),
      petJsonUrl: assetBase + "/" + f(t, "petJson"),
      spritesheetUrl: assetBase + "/" + f(t, "spritesheet"),
      version: f(t, "spriteVersionNumber") || 1,
    };
    const rows = adopting.version >= 2 ? 11 : 9;
    const th = $("dThumb");
    th.style.backgroundImage = `url(${adopting.spritesheetUrl})`;
    th.style.setProperty("--rows", rows * 100 + "%");
    th.style.setProperty("--step", -(6 * 192) + "px");
    $("dName").textContent = f(t, "displayName") || adopting.slug;
    $("dMeta").textContent = `${adopting.slug} · ${f(t, "kind") || "?"} · by ${f(t, "submittedBy") || "?"}`;
    $("dDesc").textContent = "加载描述…";
    $("dAdopt").disabled = false;
    $("dAdopt").textContent = installedNames.has(adopting.slug) ? "重新领养" : "领养";
    $("detail").classList.add("show");
    // 描述按需拉 pet.json
    fetch(adopting.petJsonUrl).then(r => r.json())
      .then(j => { $("dDesc").textContent = j.description || "（无描述）"; })
      .catch(() => { $("dDesc").textContent = ""; });
  }

  function onAdopted(m) {
    if (!m.ok) {
      $("dAdopt").disabled = false;
      $("dAdopt").textContent = "失败，重试";
      $("dDesc").textContent = "❌ " + (m.error || "安装失败");
      return;
    }
    $("detail").classList.remove("show");
    installedNames.add(m.slug);
    currentPet = m.slug;
    send({ type: "listInstalled" }); // 刷新角标
    // 重新渲染当前页以更新 badge
    applyFilter_keepScroll();
  }
  function applyFilter_keepScroll() {
    const g = $("grid"), top = g.scrollTop;
    applyFilter();
    g.scrollTop = top;
  }

  // ===== 我的宠物 =====
  function onInstalled(list, current) {
    currentPet = current;
    installedNames = new Set(list.filter(p => p.name !== "builtin").map(p => p.name));
    const mine = $("mine");
    mine.innerHTML = "";
    const mk = (name, disp, emoji) => {
      const el = document.createElement("div");
      el.className = "pet-card" + (currentPet === name ? " cur" : "");
      el.innerHTML = `<div style="font-size:56px;line-height:104px">${emoji}</div>
        <div class="nm">${disp}</div>` +
        (currentPet === name ? '<div class="badge">当前</div>' : "");
      el.onclick = () => send({ type: "dress", name });
      mine.appendChild(el);
    };
    mk("builtin", "矢量橘猫（内置）", "🐱");
    mk("lulu", "噜噜·水豚（内置皮肤）", "🌿");
    list.filter(p => p.name !== "builtin").forEach(p => {
      // 缩略图用本地精灵图
      const rows = (p.rows || 9);
      const el = document.createElement("div");
      el.className = "pet-card" + (currentPet === p.name ? " cur" : "");
      const th = document.createElement("div");
      th.className = "thumb";
      th.style.backgroundImage = `url(file://${p.path})`;
      th.style.setProperty("--rows", rows * 100 + "%");
      el.appendChild(th);
      const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = p.displayName || p.name; el.appendChild(nm);
      if (currentPet === p.name) { const b = document.createElement("div"); b.className = "badge"; b.textContent = "当前"; el.appendChild(b); }
      el.onclick = () => send({ type: "dress", name: p.name });
      mine.appendChild(el);
    });
    if (mine.children.length === 1) {
      const tip = document.createElement("div");
      tip.className = "empty"; tip.style.gridColumn = "1/-1";
      tip.textContent = "还没有领养宠物，去「市场」逛逛 →";
      mine.appendChild(tip);
    }
  }
  function onDressed(m) {
    if (m.ok) { currentPet = m.name; send({ type: "listInstalled" }); }
  }

  // ===== UI 事件 =====
  $("tabMarket").onclick = () => {
    $("tabMarket").classList.add("on"); $("tabMine").classList.remove("on");
    $("grid").style.display = "grid"; $("mine").style.display = "none";
    $("kinds").style.visibility = "visible"; $("q").style.visibility = "visible";
  };
  $("tabMine").onclick = () => {
    $("tabMine").classList.add("on"); $("tabMarket").classList.remove("on");
    $("grid").style.display = "none"; $("mine").style.display = "grid";
    $("kinds").style.visibility = "hidden"; $("q").style.visibility = "hidden";
    send({ type: "listInstalled" });
  };
  document.querySelectorAll(".kind").forEach(k => k.onclick = () => {
    document.querySelectorAll(".kind").forEach(x => x.classList.remove("on"));
    k.classList.add("on"); kind = k.dataset.k; applyFilter();
  });
  let qTimer = null;
  $("q").oninput = e => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { q = e.target.value; applyFilter(); }, 200);
  };
  $("grid").onscroll = e => {
    if (e.target.scrollTop + e.target.clientHeight > e.target.scrollHeight - 300) renderMore();
  };
  $("dCancel").onclick = () => $("detail").classList.remove("show");
  $("dAdopt").onclick = () => {
    if (!adopting) return;
    $("dAdopt").disabled = true;
    $("dAdopt").textContent = "下载中…";
    send({ type: "adopt", ...adopting });
  };

  // ===== 启动 =====
  send({ type: "getManifest" });
  send({ type: "listInstalled" });
</script>
</body>
</html>
